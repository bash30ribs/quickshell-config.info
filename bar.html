<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickShell Liquid Glass Bar — Preview</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   QUICKSHELL LIQUID GLASS BAR · HTML PREVIEW
   Faithful render of the QML spec:
   - 4 layouts: floating · islands · wide · compact
   - 3 qualities: liquid · frosted · flat
   - Optical values: clarity=0.75, rim=0.45, specular=0.70, refraction=0.85
   - Spring: mass=1.0, stiffness=420, damping=24 (≈10% overshoot)
   - Every widget present, popups wired, IPC commands simulated
   ═══════════════════════════════════════════════════════════════ */

/* ── tokens ─────────────────────────────────────────────────── */
:root{
  --tint-r: 122;
  --tint-g: 162;
  --tint-b: 255;

  --clarity:    0.75;   /* 0..1 – drives tint opacity          */
  --rim:        0.45;   /* 0..1 – rim illumination             */
  --specular:   0.70;   /* 0..1 – top sheen                    */
  --refraction: 0.85;   /* 0..1 – dispersion / hue-rotate       */

  --bar-h:      42px;
  --bar-r:      22px;
  --bar-gap:    14px;
  --bar-margin: 16px;

  --text:        #eaf0ff;
  --text-muted:  #9aa8c2;
  --text-faint:  #6e7d96;
  --accent:      #8ab4ff;

  /* spring easing – approximates ζ≈0.586 (m=1,k=420,c=24) */
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease:   cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── reset ──────────────────────────────────────────────────── */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; overflow:hidden; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
svg{ display:block; }

body{
  background:#06080c;
  color:var(--text);
  font:500 13px/1.25 -apple-system, "SF Pro Text", "Segoe UI", Inter, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-variant-numeric: tabular-nums;
  user-select:none;
}

/* ═══════════════════════════════════════════════════════════════
   WALLPAPER — saturate + shape it so backdrop blur is obvious
   (this is what Hyprland's layer-blur would actually sample)
   ═══════════════════════════════════════════════════════════════ */
.wallpaper{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(ellipse 90% 60% at 20% 20%, #14234f 0%, transparent 55%),
    radial-gradient(ellipse 80% 55% at 82% 72%, #3a1a4a 0%, transparent 55%),
    radial-gradient(ellipse 70% 70% at 55% 40%, #0a2434 0%, transparent 70%),
    linear-gradient(180deg, #06080f 0%, #08060e 100%);
}
.blob{
  position:absolute; border-radius:50%;
  filter: blur(90px);
  will-change: transform;
  animation: blobFloat 34s ease-in-out infinite alternate;
}
.blob-1{ width:520px; height:520px; background:#4a6eff;
  top:-140px; left:6%; opacity:.65;
  animation-delay:0s; }
.blob-2{ width:480px; height:480px; background:#ff5a8a;
  top:18%; right:2%; opacity:.55;
  animation-delay:-8s; }
.blob-3{ width:420px; height:420px; background:#2ad4b8;
  top:60%; left:28%; opacity:.45;
  animation-delay:-16s; }
.blob-4{ width:360px; height:360px; background:#ffb02e;
  top:8%; left:56%; opacity:.35;
  animation-delay:-24s; }
@keyframes blobFloat{
  0%   { transform: translate(0,0)   scale(1); }
  50%  { transform: translate(30px,-20px) scale(1.06); }
  100% { transform: translate(-20px,25px) scale(0.98); }
}
.noise{
  position:absolute; inset:0; opacity:.06; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
}

/* ═══════════════════════════════════════════════════════════════
   STAGE
   ═══════════════════════════════════════════════════════════════ */
.stage{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center;
  gap:36px;
  padding:22px 0 40px;
}

/* ═══════════════════════════════════════════════════════════════
   GLASS SURFACE — one class, used by bar-zone OR bar-sections
   (islands mode moves the surface from parent to children)
   ═══════════════════════════════════════════════════════════════ */
.glass-surface{
  position:relative;
  isolation:isolate;
  background: rgba(var(--tint-r), var(--tint-g), var(--tint-b), calc(var(--clarity) * 0.30));
  backdrop-filter: blur(14px) saturate(180%) contrast(1.05) brightness(1.01);
  -webkit-backdrop-filter: blur(14px) saturate(180%) contrast(1.05) brightness(1.01);
  border: 1px solid rgba(255,255,255, calc(var(--rim) * 0.16));
  border-radius: var(--bar-r);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255, calc(var(--rim) * 0.55)),
    inset 0 -1px 0 rgba(0,0,0, 0.35),
    0 10px 30px -14px rgba(0,0,0, 0.85),
    0 2px 8px -3px rgba(0,0,0, 0.5);
  transition:
    background .25s var(--ease),
    box-shadow .25s var(--ease),
    backdrop-filter .25s var(--ease);
}

/* specular top-gradient */
.glass-surface::before{
  content:""; position:absolute; inset:0;
  border-radius: inherit; pointer-events:none; z-index:0;
  background: linear-gradient(180deg,
    rgba(255,255,255, calc(var(--specular) * 0.34)) 0%,
    rgba(255,255,255, 0.02) 44%,
    rgba(0,0,0, 0.16) 100%);
  mix-blend-mode: overlay;
}

/* chromatic dispersion */
.glass-surface::after{
  content:""; position:absolute; inset:0;
  border-radius: inherit; pointer-events:none; z-index:0;
  background: linear-gradient(90deg,
    rgba(255,210,160, calc(var(--refraction) * 0.06)) 0%,
    rgba(255,255,255, 0) 45%,
    rgba(255,255,255, 0) 55%,
    rgba(170,214,255, calc(var(--refraction) * 0.06)) 100%);
}

/* content must sit above the pseudos */
.glass-surface > *{ position:relative; z-index:1; }

/* ═══════════════════════════════════════════════════════════════
   BAR ZONE — grid so center stays centered regardless of sides
   ═══════════════════════════════════════════════════════════════ */
.bar-zone{
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  gap: var(--bar-gap);
  height: var(--bar-h);
  padding: 0 14px;
  transition:
    width .35s var(--spring),
    padding .25s var(--ease),
    transform .3s var(--spring),
    opacity .25s var(--ease);
}

.bar-section{
  display:flex;
  align-items:center;
  height:100%;
  min-width:0;
  gap:10px;
  transition: padding .25s var(--ease);
}
.bar-left  { justify-self:start; }
.bar-center{ justify-self:center; }
.bar-right { justify-self:end; gap:4px; }

/* ── layout widths ──────────────────────────────────────────── */
[data-layout="floating"] .bar-zone{ width: min(1080px, calc(100vw - 32px)); }
[data-layout="wide"]     .bar-zone{ width: 72vw; }
[data-layout="compact"]  .bar-zone{ width: fit-content; padding: 0 20px; }
[data-layout="islands"]  .bar-zone{
  width: calc(100vw - 32px);
  background:transparent; backdrop-filter:none;
  border:none; box-shadow:none; padding:0;
}
[data-layout="islands"]  .bar-zone::before,
[data-layout="islands"]  .bar-zone::after{ display:none; }

/* islands: children become glass */
[data-layout="islands"] .bar-section{
  padding: 0 12px;
  width: fit-content;
}

/* hide the whole bar (IPC toggleBar) */
[data-bar-hidden="true"] .bar-zone{
  transform: translateY(calc(-100% - 30px));
  opacity:0;
  pointer-events:none;
}

/* ═══════════════════════════════════════════════════════════════
   QUALITY MODES
   ═══════════════════════════════════════════════════════════════ */
[data-quality="liquid"] .glass-surface{
  backdrop-filter: blur(14px) saturate(190%) contrast(1.06) brightness(1.03)
                   hue-rotate(calc(var(--refraction) * 8deg));
  -webkit-backdrop-filter: blur(14px) saturate(190%) contrast(1.06) brightness(1.03)
                          hue-rotate(calc(var(--refraction) * 8deg));
  background: rgba(var(--tint-r), var(--tint-g), var(--tint-b),
                   calc(var(--clarity) * 0.26));
}

[data-quality="frosted"] .glass-surface{
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  background: rgba(var(--tint-r), var(--tint-g), var(--tint-b),
                   calc(var(--clarity) * 0.36));
}
[data-quality="frosted"] .glass-surface::after{ opacity:.35; }

[data-quality="flat"] .glass-surface{
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: rgba(12, 18, 30, 0.92);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 8px 24px -14px rgba(0,0,0,0.9);
}
[data-quality="flat"] .glass-surface::before{ opacity:.45; }
[data-quality="flat"] .glass-surface::after{ display:none; }

/* ═══════════════════════════════════════════════════════════════
   INTERACTIVE WIDGET BASE — spring physics on all bar buttons
   (BarButton.qml: hover 1.025 · press 0.965 · spring release)
   ═══════════════════════════════════════════════════════════════ */
.widget{
  display:inline-flex; align-items:center; gap:6px;
  height:26px; padding:0 8px;
  border-radius:8px;
  color: var(--text-muted);
  background: transparent;
  transition:
    transform .32s var(--spring),
    background .15s var(--ease),
    color .15s var(--ease),
    box-shadow .15s var(--ease);
  transform-origin:center;
  will-change:transform;
  white-space:nowrap;
}
.widget:hover{
  transform: scale(1.025);
  color: var(--text);
  background: rgba(255,255,255,0.06);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.10);
}
.widget:active{
  transform: scale(0.965);
  transition-duration: .12s;
}
.widget:focus-visible{
  outline:1px solid rgba(var(--tint-r),var(--tint-g),var(--tint-b), 0.6);
  outline-offset:1px;
}

.widget svg{
  width:15px; height:15px;
  flex-shrink:0;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.widget .widget-value{
  font-size:11.5px; font-weight:500;
  color: var(--text);
  min-width:26px;
}

/* ═══════════════════════════════════════════════════════════════
   WORKSPACES — pill + numbered capsules
   ═══════════════════════════════════════════════════════════════ */
.workspaces{
  position:relative;
  display:flex; gap:4px;
  height:26px;
}
.ws-pill{
  position:absolute;
  border-radius:999px;
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.22);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.24),
    0 2px 8px -3px rgba(0,0,0,0.5);
  pointer-events:none;
  z-index:1;
  transition:
    left .34s var(--spring),
    top .34s var(--spring),
    width .34s var(--spring),
    height .34s var(--spring),
    opacity .2s var(--ease);
}
.ws{
  position:relative; z-index:2;
  height:26px; min-width:26px; padding:0 8px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.045);
  color: rgba(234,240,255,0.72);
  font-size:12px; font-weight:500;
  transition:
    transform .32s var(--spring),
    background .15s var(--ease),
    color .15s var(--ease),
    border-color .15s var(--ease);
  transform-origin:center;
  will-change:transform;
}
.ws:hover{
  transform: scale(1.06);
  background: rgba(255,255,255,0.12);
  color: var(--text);
}
.ws:active{ transform: scale(0.94); transition-duration:.1s; }
.ws.active{
  color: var(--text);
  border-color: transparent;
  background: transparent;
  font-weight:600;
}

/* ═══════════════════════════════════════════════════════════════
   MEDIA PILL — NowBarPill.qml
   ═══════════════════════════════════════════════════════════════ */
.media-pill{
  height:30px;
  padding:0 10px 0 4px;
  gap:8px;
  border-radius:10px;
  background: rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.05);
}
.media-pill:hover{
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.14);
}
.album-art{
  width:22px; height:22px;
  border-radius:5px;
  background:
    radial-gradient(circle at 30% 30%, #ff5a8a 0%, transparent 55%),
    radial-gradient(circle at 70% 70%, #4a6eff 0%, transparent 55%),
    linear-gradient(135deg, #2ad4b8, #6a2ff5);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.15),
    0 1px 2px rgba(0,0,0,0.4);
  flex-shrink:0;
}
.media-info{
  display:flex; flex-direction:column;
  align-items:flex-start; gap:0;
  max-width:140px; overflow:hidden;
}
.media-info .track{
  font-size:11.5px; font-weight:600;
  color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:130px;
}
.media-info .artist{
  font-size:9.5px; font-weight:500;
  color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:130px;
  margin-top:-1px;
}
.visualizer{
  display:flex; align-items:flex-end; gap:2px;
  height:14px; width:16px;
  flex-shrink:0;
}
.visualizer span{
  flex:1; min-width:2px;
  background: linear-gradient(180deg, var(--accent), rgba(138,180,255,0.3));
  border-radius:1px;
  transform-origin: bottom;
  animation: visPulse 1.1s ease-in-out infinite;
}
.visualizer span:nth-child(1){ animation-delay:0s;    }
.visualizer span:nth-child(2){ animation-delay:-.28s; }
.visualizer span:nth-child(3){ animation-delay:-.55s; }
.visualizer span:nth-child(4){ animation-delay:-.82s; }
@keyframes visPulse{
  0%,100% { transform: scaleY(0.28); opacity:.7; }
  45%     { transform: scaleY(1);    opacity:1;  }
}
/* pause visualizer when media popup is closed and idle */
@media (prefers-reduced-motion: reduce){
  .visualizer span, .blob{ animation:none; }
}

/* ═══════════════════════════════════════════════════════════════
   CLOCK — ClockWidget.qml
   ═══════════════════════════════════════════════════════════════ */
.clock{
  gap:8px;
  height:26px;
  padding:0 10px;
}
.clock-day,
.clock-date{
  font-size:11.5px; font-weight:500;
  color:var(--text-muted);
}
.clock-date{
  position:relative; padding-right:8px;
}
.clock-date::after{
  content:"·";
  position:absolute; right:0; top:50%;
  transform: translateY(-50%);
  color:var(--text-faint);
  font-size:14px;
  line-height:1;
}
.clock-time{
  font-size:12.5px; font-weight:600;
  color:var(--text);
  letter-spacing:.3px;
}

/* ═══════════════════════════════════════════════════════════════
   RIGHT-SIDE ICON WIDGETS
   ═══════════════════════════════════════════════════════════════ */
.icon-widget{ padding:0 7px; gap:5px; }
.icon-widget svg{ width:14px; height:14px; }

/* network rates */
.net-rates{
  display:flex; gap:4px;
  font-size:9.5px; font-weight:500;
  color:var(--text-muted);
  letter-spacing:.2px;
}
.net-rates .up,
.net-rates .down{
  display:inline-flex; gap:2px; align-items:center;
}
.net-rates .up::before{
  content:""; display:inline-block; width:5px; height:5px;
  background: #5be0b3; border-radius:1px;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.net-rates .down::before{
  content:""; display:inline-block; width:5px; height:5px;
  background: var(--accent); border-radius:1px;
  clip-path: polygon(50% 100%, 100% 0, 0 0);
}

/* bluetooth on state */
.widget[data-on="true"]{ color: var(--accent); }
.widget[data-on="true"] .widget-value{ color: var(--text); }

/* battery charging */
.widget[data-charging="true"] svg{ color:#5be0b3; }
.battery-bar{
  display:inline-block; width:8px; height:8px;
  background: currentColor;
  clip-path: polygon(50% 0, 0 60%, 45% 60%, 45% 100%, 100% 40%, 55% 40%);
  margin-left:2px;
  color:#5be0b3;
  display:none;
}
.widget[data-charging="true"] .battery-bar{ display:inline-block; }

/* ═══════════════════════════════════════════════════════════════
   POPUPS — dark glass panels appearing under triggers
   ═══════════════════════════════════════════════════════════════ */
.popup{
  position:fixed;
  z-index:50;
  min-width:260px;
  padding:16px 18px;
  border-radius:16px;
  background: rgba(10, 14, 22, 0.82);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.10);
  box-shadow:
    0 24px 60px -20px rgba(0,0,0,0.95),
    0 4px 14px -6px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255,255,255,0.10);
  opacity:0;
  visibility:hidden;
  transform: translateY(-6px) scale(0.97);
  transform-origin: top center;
  transition:
    opacity .18s var(--ease),
    visibility .18s,
    transform .26s var(--spring);
  pointer-events:none;
}
.popup.open{
  opacity:1;
  visibility:visible;
  transform: translateY(0) scale(1);
  pointer-events:auto;
}

.popup h3{
  margin:0 0 12px;
  font-size:11px;
  font-weight:600;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--text-muted);
}

.popup-row{
  display:flex; align-items:center;
  gap:10px; margin-bottom:10px;
}
.popup-row svg{
  width:16px; height:16px; color:var(--text-muted); flex-shrink:0;
}
.popup-row output{
  min-width:36px; text-align:right;
  font-size:11.5px; color:var(--text);
}

.popup input[type=range]{
  appearance:none; -webkit-appearance:none;
  flex:1; height:4px;
  background: rgba(255,255,255,0.10);
  border-radius:999px; outline:none;
  cursor:pointer;
}
.popup input[type=range]::-webkit-slider-thumb{
  appearance:none; -webkit-appearance:none;
  width:13px; height:13px; border-radius:50%;
  background: linear-gradient(180deg, #d9e6ff, var(--accent));
  border:1px solid rgba(255,255,255,0.4);
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  transition: transform .12s var(--spring);
}
.popup input[type=range]::-webkit-slider-thumb:hover{ transform:scale(1.15); }
.popup input[type=range]::-moz-range-thumb{
  width:13px; height:13px; border-radius:50%;
  background: var(--accent);
  border:1px solid rgba(255,255,255,0.4);
}

/* audio popup specific */
.sink-row{ justify-content:space-between; }
.sink-label{
  font-size:11px; color:var(--text-muted);
  letter-spacing:.4px; text-transform:uppercase;
}
.sink-select{
  flex:1; margin-left:8px;
  padding:5px 8px;
  border-radius:8px;
  background: rgba(255,255,255,0.06);
  color:var(--text);
  border:1px solid rgba(255,255,255,0.08);
  font-size:11.5px;
  outline:none;
}
.sink-select:focus{ border-color: rgba(var(--tint-r),var(--tint-g),var(--tint-b),0.5); }

.app-mixers{
  margin-top:6px; padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex; flex-direction:column; gap:6px;
}
.app-mixer{
  display:grid; grid-template-columns: 70px 1fr;
  align-items:center; gap:8px;
  font-size:11px; color:var(--text-muted);
}

/* clock/calendar popup */
.cal-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
  font-size:12px; font-weight:600;
}
.cal-header button{
  width:24px; height:24px;
  border-radius:6px;
  color:var(--text-muted);
  display:flex; align-items:center; justify-content:center;
  transition: background .15s, color .15s;
}
.cal-header button:hover{ background:rgba(255,255,255,0.08); color:var(--text); }
#cal-month{ letter-spacing:.3px; }

.cal-grid{
  display:grid;
  grid-template-columns: repeat(7, 1fr);
  gap:2px;
  margin-bottom:14px;
}
.cal-dow{
  font-size:9.5px; font-weight:600;
  color:var(--text-faint);
  text-align:center;
  padding:4px 0 6px;
  letter-spacing:.4px;
}
.cal-cell{
  aspect-ratio:1;
  display:flex; align-items:center; justify-content:center;
  font-size:11.5px; font-weight:500;
  color:var(--text-muted);
  border-radius:6px;
  transition: background .12s;
  cursor:default;
}
.cal-cell:hover:not(.empty):not(.today){ background: rgba(255,255,255,0.05); }
.cal-cell.empty{ color:transparent; }
.cal-cell.today{
  background: rgba(var(--tint-r),var(--tint-g),var(--tint-b),0.30);
  color:#fff;
  font-weight:600;

.power-row{

<script>
(() => {
  "use strict";

  /* ═══════════════════════════════════════════════════════════
     STATE
     ═══════════════════════════════════════════════════════════ */
  const state = {
    layout:     'floating',
    quality:    'liquid',
    workspace:  1,
    volume:     72,
    monitor:    85,
    barHidden:  false,
    calYear:    new Date().getFullYear(),
    calMonth:   new Date().getMonth(),
  };

  /* ═══════════════════════════════════════════════════════════
     HELPERS
     ═══════════════════════════════════════════════════════════ */
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const pad = n => String(n).padStart(2, '0');

  /* ═══════════════════════════════════════════════════════════
     LAYOUT SWITCH
     — floating / wide / compact → glass on .bar-zone
     — islands                   → glass on each .bar-section
     ═══════════════════════════════════════════════════════════ */
  const barZone  = $('#bar-zone');
  const sections = $$('.bar-section');

  function setLayout(mode) {
    state.layout = mode;
    document.body.dataset.layout = mode;

    if (mode === 'islands') {
      barZone.classList.remove('glass-surface');
      sections.forEach(s => s.classList.add('glass-surface'));
    } else {
      barZone.classList.add('glass-surface');
      sections.forEach(s => s.classList.remove('glass-surface'));
    }

    // sections need a moment to reflow before we measure the ws-pill
    requestAnimationFrame(moveWsPill);
    syncStatusBadge();
  }

  /* ═══════════════════════════════════════════════════════════
     QUALITY SWITCH
     ═══════════════════════════════════════════════════════════ */
  function setQuality(mode) {
    state.quality = mode;
    document.body.dataset.quality = mode;
    syncStatusBadge();
  }

  /* ═══════════════════════════════════════════════════════════
     STATUS BADGE
     ═══════════════════════════════════════════════════════════ */
  function syncStatusBadge() {
    $('#status-badge').textContent =
      `${state.layout} · ${state.quality}` +
      (state.barHidden ? ' · hidden' : '');
  }

  /* ═══════════════════════════════════════════════════════════
     WORKSPACES · spring pill
     ═══════════════════════════════════════════════════════════ */
  const wsWrap = $('#workspaces');
  const wsPill = $('#ws-pill');
  const wsBtns = $$('.ws');

  function moveWsPill() {
    const active = $('.ws.active');
    if (!active) return;
    const a = active.getBoundingClientRect();
    const w = wsWrap.getBoundingClientRect();
    wsPill.style.left   = (a.left - w.left - 3) + 'px';
    wsPill.style.top    = (a.top  - w.top  - 3) + 'px';
    wsPill.style.width  = (a.width  + 6) + 'px';
    wsPill.style.height = (a.height + 6) + 'px';
    wsPill.style.opacity = '1';
  }

  function setWorkspace(n) {
    state.workspace = n;
    wsBtns.forEach(b => {
      const on = +b.dataset.ws === n;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on);
    });
    // one rAF ensures the layout has settled for the transition
    requestAnimationFrame(moveWsPill);
  }

  wsBtns.forEach(b => {
    b.addEventListener('click', () => setWorkspace(+b.dataset.ws));
  });

  wsWrap.addEventListener('wheel', e => {
    e.preventDefault();
    let n = state.workspace + (e.deltaY > 0 ? 1 : -1);
    n = Math.max(1, Math.min(5, n));
    setWorkspace(n);
  }, { passive: false });

  /* ═══════════════════════════════════════════════════════════
     CLOCK
     ═══════════════════════════════════════════════════════════ */
  const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun',
                  'Jul','Aug','Sep','Oct','Nov','Dec'];

  function tickClock() {
    const now = new Date();
    $('#clock-day').textContent  = DAYS[now.getDay()];
    $('#clock-date').textContent = `${MONTHS[now.getMonth()]} ${now.getDate()}`;
    $('#clock-time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ═══════════════════════════════════════════════════════════
     NETWORK RATES · simulated activity
     ═══════════════════════════════════════════════════════════ */
  function jitterRates() {
    const up = (Math.random() * 1.8 + 0.1).toFixed(1);
    const dn = (Math.random() * 10 + 1.2).toFixed(1);
    $('#net-up').textContent   = up;
    $('#net-down').textContent = dn;
  }
  jitterRates();
  setInterval(jitterRates, 2400);

  /* ═══════════════════════════════════════════════════════════
     POPUPS
     ═══════════════════════════════════════════════════════════ */
  let openPopupName = null;

  function closeAllPopups() {
    $$('.popup.open').forEach(p => p.classList.remove('open'));
    openPopupName = null;
  }

  function openPopup(name, triggerEl) {
    const popup = $(`.popup[data-popup="${name}"]`);
    if (!popup) return;

    // if this popup is already open, close it (toggle)
    if (popup.classList.contains('open')) {
      popup.classList.remove('open');
      openPopupName = null;
      return;
    }

    // close others
    $$('.popup.open').forEach(p => {
      if (p !== popup) p.classList.remove('open');
    });

    // measure then position — must be visible to measure width
    popup.classList.add('open');

    const rect = triggerEl.getBoundingClientRect();
    const pw   = popup.offsetWidth;
    const ph   = popup.offsetHeight;
    const vw   = window.innerWidth;
    const vh   = window.innerHeight;

    // prefer centered under trigger, clamped to viewport
    let left = rect.left + rect.width / 2 - pw / 2;
    left = Math.max(12, Math.min(left, vw - pw - 12));

    let top = rect.bottom + 8;
    if (top + ph > vh - 12) top = Math.max(12, rect.top - ph - 8);

    popup.style.left = left + 'px';
    popup.style.top  = top  + 'px';

    openPopupName = name;
  }

  // bind triggers
  $$('[data-popup]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const name = el.dataset.popup;
      // media popup not implemented — ignore gracefully
      if (name === 'media') return;
      // several triggers share a popup type (none currently), but be safe:
      openPopup(name, el);
    });
  });

  // click outside → close
  document.addEventListener('click', e => {
    if (!e.target.closest('.popup') && !e.target.closest('[data-popup]')) {
      closeAllPopups();
    }
  });

  // Esc → close
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAllPopups();
    if (e.key >= '1' && e.key <= '5') setWorkspace(+e.key);
  });

  window.addEventListener('resize', () => {
    moveWsPill();
    // reposition open popup
    if (openPopupName) {
      const trigger = $(`[data-popup="${openPopupName}"]`);
      const popup   = $(`.popup[data-popup="${openPopupName}"]`);
      if (trigger && popup) {
        popup.classList.remove('open');
        requestAnimationFrame(() => {
          popup.classList.add('open');
          const rect = trigger.getBoundingClientRect();
          const pw   = popup.offsetWidth;
          const vw   = window.innerWidth;
          let left = rect.left + rect.width / 2 - pw / 2;
          left = Math.max(12, Math.min(left, vw - pw - 12));
          popup.style.left = left + 'px';
          popup.style.top  = (rect.bottom + 8) + 'px';
        });
      }
    }
  });

  /* ═══════════════════════════════════════════════════════════
     AUDIO POPUP · volume slider drives the bar widget
     ═══════════════════════════════════════════════════════════ */
  const volSlider = $('#vol-slider');
  const volOut    = $('#vol-out');
  const audioPct  = $('#audio-pct');

  volSlider.addEventListener('input', () => {
    const v = +volSlider.value;
    state.volume = v;
    volOut.textContent   = v + '%';
    audioPct.textContent = v + '%';
  });

  /* ═══════════════════════════════════════════════════════════
     CALENDAR
     ═══════════════════════════════════════════════════════════ */
  const calGrid  = $('#cal-grid');
  const calMonth = $('#cal-month');
  const today    = new Date();

  function renderCalendar(year, month) {
    state.calYear  = year;
    state.calMonth = month;

    calMonth.textContent = `${MONTHS[month]} ${year}`;

    const firstDay    = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const isThisMonth = today.getFullYear() === year && today.getMonth() === month;

    let html = '';
    ['S','M','T','W','T','F','S'].forEach(d => {
      html += `<div class="cal-dow">${d}</div>`;
    });
    for (let i = 0; i < firstDay; i++) {
      html += `<div class="cal-cell empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const isToday = isThisMonth && today.getDate() === d;
      html += `<div class="cal-cell${isToday ? ' today' : ''}">${d}</div>`;
    }
    calGrid.innerHTML = html;
  }

  $('#cal-prev').addEventListener('click', () => {
    let m = state.calMonth - 1, y = state.calYear;
    if (m < 0) { m = 11; y--; }
    renderCalendar(y, m);
  });
  $('#cal-next').addEventListener('click', () => {
    let m = state.calMonth + 1, y = state.calYear;
    if (m > 11) { m = 0; y++; }
    renderCalendar(y, m);
  });

  renderCalendar(state.calYear, state.calMonth);

  /* ═══════════════════════════════════════════════════════════
     OPTICAL SLIDERS
     ═══════════════════════════════════════════════════════════ */
  const rootStyle = document.documentElement.style;

  [
    ['clarity',    'v-clarity',    'o-clarity',    v => v.toFixed(2)],
    ['rim',        'v-rim',        'o-rim',        v => v.toFixed(2)],
    ['specular',   'v-specular',   'o-specular',   v => v.toFixed(2)],
    ['refraction', 'v-refraction', 'o-refraction', v => v.toFixed(2)],
  ].forEach(([varName, sliderId, outId, fmt]) => {
    const input = $('#' + sliderId);
    const out   = $('#' + outId);
    const apply = () => {
      const v = parseFloat(input.value);
      rootStyle.setProperty('--' + varName, v);
      out.textContent = fmt(v);
    };
    input.addEventListener('input', apply);
    apply();
  });

  /* ═══════════════════════════════════════════════════════════
     LAYOUT & QUALITY SEGMENTS
     ═══════════════════════════════════════════════════════════ */
  $('#seg-layout').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    $$('#seg-layout button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setLayout(btn.dataset.layout);
  });

  $('#seg-quality').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    $$('#seg-quality button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setQuality(btn.dataset.quality);
  });

  /* ═══════════════════════════════════════════════════════════
     IPC-STYLE COMMANDS
     ═══════════════════════════════════════════════════════════ */
  function showBar() {
    state.barHidden = false;
    document.body.dataset.barHidden = 'false';
    syncStatusBadge();
  }
  function hideBar() {
    state.barHidden = true;
    document.body.dataset.barHidden = 'true';
    closeAllPopups();
    syncStatusBadge();
  }
  function toggleBar() {
    state.barHidden ? showBar() : hideBar();
  }

  $$('.ipc-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const cmd = btn.dataset.ipc;
      switch (cmd) {
        case 'toggle audio':
          openPopup('audio', $(`[data-popup="audio"]`));
          break;
        case 'toggle clock':
          openPopup('clock', $(`[data-popup="clock"]`));
          break;
        case 'toggleBar':
          toggleBar();
          break;
        case 'showBar':
          showBar();
          break;
        case 'hideBar':
          hideBar();
          break;
        case 'getMode':
          console.log('barpopups getMode →', state.layout);
          break;
      }
    });
  });

  /* ═══════════════════════════════════════════════════════════
     INIT
     ═══════════════════════════════════════════════════════════ */
  function init() {
    setLayout(state.layout);
    setQuality(state.quality);

    // double rAF: layout must be measured twice for correct pill coords
    requestAnimationFrame(() => {
      requestAnimationFrame(moveWsPill);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // expose for debugging
  window.__bar = { state, setLayout, setQuality, setWorkspace, toggleBar };
})();
</script>
</body>
</html>
